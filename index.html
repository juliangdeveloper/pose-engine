<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Cuenta repeticiones y mide ángulos con la cámara, en tu dispositivo.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pose">
  <meta property="og:title" content="Pose Engine">
  <meta property="og:description" content="Cuenta repeticiones y mide ángulos con la cámara, en tu dispositivo.">
  <meta property="og:image" content="assets/icon-512.png">
  <title>Pose Engine</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.json?v=0.1.5">
  <link rel="stylesheet" href="css/styles.css?v=0.1.5">
</head>
<body>
  <header class="bar">
    <p class="bar-title">Pose Engine</p>
    <div class="bar-end">
      <span class="bar-version" id="bar-version"></span>
      <button class="icon-btn" type="button" id="btn-info" aria-label="Información">i</button>
    </div>
  </header>

  <div class="layout">
    <main class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <button class="zoom-btn" type="button" id="btn-zoom" hidden aria-label="Ampliar encuadre" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10" cy="10" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M7.2 10h5.6M14.7 14.7 20 20"/>
        </svg>
        <span id="zoom-label">1×</span>
      </button>
      <div class="stage-msg" id="stage-msg">
        <p id="stage-text"></p>
        <p class="stage-hint" id="stage-hint"></p>
      </div>
    </main>

    <aside class="panel">
      <nav class="picker" id="picker" aria-label="Ejercicio"></nav>

      <section class="hud" aria-live="polite">
        <div class="counter">
          <span class="counter-label" id="counter-label">Reps</span>
          <span class="counter-value" id="counter-value">0</span>
          <span class="counter-sub" id="counter-sub"></span>
        </div>
        <div class="readout">
          <span class="phase" id="phase">Sin cuerpo</span>
          <p class="cue" id="cue"></p>
        </div>
      </section>

      <footer class="controls">
        <button class="btn btn-primary" type="button" id="btn-camera">Cámara</button>
        <button class="btn btn-flip" type="button" id="btn-flip" aria-label="Cambiar cámara" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" d="M9.1 7.4 10 5.4h4l.9 2"/>
            <rect x="4.3" y="7.4" width="15.4" height="10.6" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12.7" r="2.15" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M17.2 3.6a7.6 7.6 0 0 1 3.3 3.6"/>
            <path fill="currentColor" d="m19.4 2.5 1.6 3.2-3.2-.2z"/>
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6.8 20.4A7.6 7.6 0 0 1 3.5 16.8"/>
            <path fill="currentColor" d="m4.6 21.5-1.6-3.2 3.2.2z"/>
          </svg>
        </button>
        <button class="btn" type="button" id="btn-reset" aria-label="Reiniciar contador">↺</button>
      </footer>
    </aside>
  </div>

  <dialog class="sheet" id="info">
    <form method="dialog" class="sheet-body">
      <h2>Pose Engine</h2>
      <p>La cámara se procesa en tu dispositivo y no se envía ninguna imagen.</p>
      <p>Encadra hombros y brazos para flexiones y dominadas, y cadera y rodillas para sentadillas.</p>
      <p class="tenue" id="info-version"></p>
      <button class="btn btn-primary" value="close">Cerrar</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js?v=0.1.5"></script>
</body>
</html>
