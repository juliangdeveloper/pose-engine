<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Motor de estimación de pose en tiempo real con la cámara: cuenta repeticiones y mide ángulos de calistenia en el dispositivo.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pose">
  <meta property="og:title" content="Pose Engine">
  <meta property="og:description" content="Motor de estimación de pose en tiempo real con la cámara: cuenta repeticiones y mide ángulos de calistenia en el dispositivo.">
  <meta property="og:image" content="assets/icon-512.png">
  <title>Pose Engine</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.json?v=0.1.0">
  <link rel="stylesheet" href="css/styles.css?v=0.1.0">
</head>
<body>
  <header class="bar">
    <p class="bar-title">Pose Engine</p>
    <div class="bar-end">
      <span class="bar-version" id="bar-version"></span>
      <button class="icon-btn" type="button" id="btn-info" aria-label="Información">i</button>
    </div>
  </header>

  <div class="layout">
    <main class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div class="stage-msg" id="stage-msg">
        <p id="stage-text"></p>
        <p class="stage-hint" id="stage-hint"></p>
        <button class="btn btn-ghost" type="button" id="btn-msg-demo" hidden>▶ Ver demo</button>
      </div>
    </main>

    <aside class="panel">
      <nav class="picker" id="picker" aria-label="Ejercicio"></nav>

      <section class="hud" aria-live="polite">
        <div class="counter">
          <span class="counter-label" id="counter-label">Reps</span>
          <span class="counter-value" id="counter-value">0</span>
          <span class="counter-sub" id="counter-sub"></span>
        </div>
        <div class="readout">
          <span class="phase" id="phase">Sin cuerpo</span>
          <p class="cue" id="cue"></p>
          <p class="status" id="status"></p>
        </div>
      </section>

      <footer class="controls">
        <button class="btn btn-primary" type="button" id="btn-camera">Cámara</button>
        <button class="btn" type="button" id="btn-flip" aria-label="Girar cámara">Girar</button>
        <button class="btn" type="button" id="btn-demo">Demo</button>
        <button class="btn" type="button" id="btn-reset" aria-label="Reiniciar contador">↺</button>
      </footer>
    </aside>
  </div>

  <dialog class="sheet" id="info">
    <form method="dialog" class="sheet-body">
      <h2>Pose Engine</h2>
      <p>Motor de estimación de pose en tiempo real. La cámara se procesa en tu dispositivo; no se envía ninguna imagen.</p>
      <p>Ponte de lado para flexiones y plancha, y con el cuerpo entero a la vista. Los ángulos se dibujan sobre las articulaciones.</p>
      <p class="proyecto-fase" id="proyecto-fase"></p>
      <ul class="puntos" id="puntos"></ul>
      <p class="tenue" id="info-version"></p>
      <button class="btn btn-primary" value="close">Cerrar</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js?v=0.1.0"></script>
</body>
</html>
